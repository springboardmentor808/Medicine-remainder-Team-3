version: '3.8'

services:
  # ========================================================
  # Backend — FastAPI + Uvicorn
  # ========================================================
  backend:
    build:
      context: ./backend
    container_name: pillsync_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-med_db}
      - POSTGRES_URL_SYNC=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-med_db}
      - MONGO_URL=mongodb://mongo:27017/${POSTGRES_DB:-med_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pillsync_network

  # ========================================================
  # Frontend — Next.js
  # ========================================================
  frontend:
    build:
      context: ./frontend
    container_name: pillsync_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - pillsync_network

  # ========================================================
  # PostgreSQL — Primary Relational Database
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: pillsync_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-med_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-med_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pillsync_network

  # ========================================================
  # MongoDB — Medicine Metadata (Phase 2+: OCR, Prescriptions)
  # ========================================================
  mongo:
    image: mongo:7.0
    container_name: pillsync_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pillsync_network

  # ========================================================
  # Redis — Session Cache, Rate Limiting, Reminder Queues
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: pillsync_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pillsync_network

# ========================================================
# Persistent Volumes
# ========================================================
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local

# ========================================================
# Shared Network
# ========================================================
networks:
  pillsync_network:
    driver: bridge
